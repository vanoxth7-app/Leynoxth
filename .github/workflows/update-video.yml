name: Mettre à jour la dernière vidéo

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire le flux YouTube
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCKHFVF1DCai3T19rSYSPVfg"
          SKIP_SHORTS = True

          NS = {"a": "http://www.w3.org/2005/Atom",
                "yt": "http://www.youtube.com/xml/schemas/2015"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def is_short(video_id):
              opener = urllib.request.build_opener(NoRedirect)
              req = urllib.request.Request(
                  "https://www.youtube.com/shorts/" + video_id,
                  method="HEAD", headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with opener.open(req, timeout=15) as r:
                      return r.status == 200
              except Exception:
                  return False

          url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL_ID
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())

          videos = []
          for e in root.findall("a:entry", NS):
              videos.append({
                  "id": e.find("yt:videoId", NS).text,
                  "title": e.find("a:title", NS).text,
              })

          if not videos:
              raise SystemExit("Aucune video trouvee")

          chosen = videos[0]
          if SKIP_SHORTS:
              for v in videos:
                  if not is_short(v["id"]):
                      chosen = v
                      break

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(chosen, f, ensure_ascii=False)
              f.write("\n")
          print("Derniere video :", chosen)
          PY

      - name: Enregistrer si ça a changé
        run: |
          if [ -n "$(git status --porcelain latest.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add latest.json
            git commit -m "Mise à jour de la dernière vidéo"
            git push
          fi
