<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes liens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b0720;--bg2:#2a0f5c;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--text:#f4f1ff;--muted:#b9b0dd;--accent:#7cf5ff;--accent2:#ff4fd8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b0720;--bg2:#2a0f5c;--text:#f4f1ff}}
:root[data-theme="dark"]{--bg1:#0b0720;--bg2:#2a0f5c;--text:#f4f1ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Poppins,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 60%) fixed;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding:32px 18px 48px}
.avatar{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font:700 48px Bangers,cursive;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 4px var(--bg1),0 0 30px var(--accent2)}
h1{font:400 clamp(38px,11vw,56px)/1 Bangers,cursive;letter-spacing:2px;text-align:center;margin:0;text-shadow:3px 3px 0 var(--accent2)}
.bio{text-align:center;color:var(--muted);margin:10px 0 28px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;backdrop-filter:blur(8px);transition:transform .15s,box-shadow .15s,border-color .15s}
.link:hover,.link:focus-visible{transform:translateY(-3px) scale(1.01);border-color:var(--accent);box-shadow:0 8px 24px rgba(124,245,255,.25)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:400 22px Bangers,cursive;color:#fff;flex:none}
.link small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.arrow{margin-left:auto;color:var(--muted)}
h2{font:400 30px Bangers,cursive;letter-spacing:1.5px;margin:36px 0 12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.card b{display:block;font:400 13px Poppins;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.card span{display:block;margin-top:6px;font:400 22px Bangers,cursive;letter-spacing:1px}
.copy{cursor:pointer;width:100%;text-align:left;color:var(--text);font-family:inherit}
.copy:hover{border-color:var(--accent2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;padding:10px 18px;border-radius:99px;background:var(--accent);color:#0b0720;font-weight:600;transition:.25s}
.toast.on{transform:translate(-50%,0);opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px}
.video{display:block;position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;text-decoration:none;color:var(--text);border:1px solid var(--line);background:linear-gradient(135deg,#ff0033 0%,var(--bg2) 55%,var(--accent2) 100%);transition:transform .15s,box-shadow .15s}
.video:hover,.video:focus-visible{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,79,216,.35)}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#ff0033;font-size:30px;padding-left:5px}
.vtitle{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:600}
.vtitle small{display:block;color:var(--muted);font-weight:400}
.embed{aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000}
.embed iframe{width:100%;height:100%;border:0;display:block}
.video[hidden],.embed[hidden]{display:none}
.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb[hidden]{display:none}
.about{color:var(--muted);line-height:1.6;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="avatar" id="avatar">P</div>
  <h1 id="name">TON PSEUDO</h1>
  <p class="bio" id="bio">Créateur de contenu Fortnite 🎮 Clips, lives et bonne ambiance !</p>
  <nav class="links" id="links" aria-label="Réseaux sociaux"></nav>

  <h2>▶️ Dernière vidéo</h2>
  <a class="video" id="video" target="_blank" rel="noopener noreferrer"><img id="thumb" class="thumb" alt="" hidden><span class="play">▶</span><span class="vtitle" id="vtitle"></span></a>

  <h2>⚡ Fortnite</h2>
  <div class="grid" id="fn"></div>

  <h2>🖱️ Mon setup</h2>
  <div class="grid" id="setup"></div>

  <h2>👋 À propos</h2>
  <p class="about" id="about"></p>

  <footer>© <span id="year"></span> · Merci d’être là 💜</footer>
</main>
<div class="toast" id="toast">Copié !</div>

<script>
// ✏️ MODIFIE ICI : ton pseudo, ta bio et tes liens (remplace les "#" par tes vrais liens)
const CONFIG = {
  name: "LEYNOXTH",
  bio: "Créateur de contenu Fortnite 🎮 Clips, lives et bonne ambiance !",
  links: [
    {label:"YouTube",  sub:"Mes vidéos et mes lives", url:"https://youtube.com/@leynoxth_tv", icon:"Y", color:"#ff0033"},
    {label:"TikTok",   sub:"Mes clips courts",        url:"https://www.tiktok.com/@leynoxth", icon:"T", color:"#111"},
    {label:"Instagram",sub:"Photos et stories",       url:"https://www.instagram.com/leynoxth/", icon:"I", color:"linear-gradient(135deg,#feda75,#d62976,#4f5bd5)"},
    {label:"X (Twitter)",sub:"Mes news en direct",    url:"https://x.com/Leynoxth", icon:"X", color:"#000"},
    {label:"Facebook", sub:"Ma page",                 url:"#", icon:"F", color:"#1877f2"},
    {label:"Discord",  sub:"Rejoins la commu !",      url:"#", icon:"D", color:"#5865f2"}
  ],
  video: {id:"", title:"Ma dernière vidéo", sub:"Clique pour la regarder sur YouTube", url:"https://youtube.com/@leynoxth_tv/videos"},
  setup: [
    {title:"Souris", value:"Ta souris", url:"#"},
    {title:"Clavier", value:"Ton clavier", url:"#"},
    {title:"Manette", value:"Ta manette", url:"#"},
    {title:"Écran", value:"Ton écran", url:"#"},
    {title:"Micro", value:"Ton micro", url:"#"},
    {title:"Casque", value:"Ton casque", url:"#"}
  ],
  about: "Salut ! Je suis [ton prénom], je joue à Fortnite depuis [année] et je partage mes meilleurs moments, mes astuces et mes lives avec la commu. Abonne-toi pour ne rien rater !",
  fortnite: [
    {title:"Pseudo Epic",  value:"TonPseudoEpic", copy:true},
    {title:"Code île créative", value:"0000-0000-0000", copy:true},
    {title:"Code créateur", value:"TON-CODE", copy:true},
    {title:"Mon tracker",  value:"Voir mes stats", url:"#"}
  ]
};

const $ = id => document.getElementById(id);
$("name").textContent = CONFIG.name;
$("bio").textContent = CONFIG.bio;
$("avatar").textContent = CONFIG.name.trim().charAt(0).toUpperCase();
$("year").textContent = new Date().getFullYear();
document.title = CONFIG.name + " – Mes liens";

CONFIG.links.filter(l => l.url !== "#").forEach(l => {
  const a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.innerHTML = '<span class="ic" style="background:' + l.color + '">' + l.icon + '</span><span>' + l.label + '<small>' + l.sub + '</small></span><span class="arrow">→</span>';
  $("links").appendChild(a);
});

let t;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(t);t=setTimeout(()=>e.classList.remove("on"),1500)}

CONFIG.fortnite.forEach(f => {
  let el;
  if (f.url) { el = document.createElement("a"); el.href = f.url; el.target = "_blank"; el.rel = "noopener noreferrer"; el.style.textDecoration = "none"; el.style.color = "inherit"; }
  else { el = document.createElement("button"); el.type = "button"; el.className = "copy";
    el.addEventListener("click", async () => { try { await navigator.clipboard.writeText(f.value); toast("Copié !"); } catch(e) { toast(f.value); } }); }
  el.classList.add("card");
  el.innerHTML = '<b>' + f.title + '</b><span>' + f.value + '</span>';
  $("fn").appendChild(el);
});

$("video").href = CONFIG.video.url;
if (CONFIG.video.id) { const im = $("thumb"); im.onload = () => { im.hidden = false; }; im.onerror = () => { im.hidden = true; }; im.src = "https://i.ytimg.com/vi/" + CONFIG.video.id + "/hqdefault.jpg"; }
$("vtitle").innerHTML = CONFIG.video.title + "<small>" + CONFIG.video.sub + "</small>";
$("about").textContent = CONFIG.about;
CONFIG.setup.forEach(s => {
  const a = document.createElement("a");
  a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.style.textDecoration = "none"; a.style.color = "inherit";
  a.innerHTML = "<b>" + s.title + "</b><span>" + s.value + "</span>";
  $("setup").appendChild(a);
});

// Dernière vidéo : lue dans latest.json, mis à jour toutes les heures par GitHub Actions
fetch("latest.json", {cache: "no-store"}).then(r => r.json()).then(v => {
  if (!v || !v.id) return;
  $("video").href = "https://www.youtube.com/watch?v=" + v.id;
  const t = $("vtitle");
  t.textContent = v.title || "Ma dernière vidéo";
  const sm = document.createElement("small");
  sm.textContent = "Clique pour la regarder sur YouTube";
  t.appendChild(sm);
  const im = $("thumb");
  im.onload = () => { im.hidden = false; };
  im.src = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg";
}).catch(() => {});
</script>
</body>
</html>
